# Build Windows
#
# Builds the Floq desktop app (Tauri 2) on windows-latest and produces an NSIS
# installer (.exe). Unsigned for now. No MSI: an MSI and an NSIS install of the same app
# side by side break upgrades and uninstall; the NSIS installer removes an old MSI install itself.
#
# Triggers
#   - push to main (every push builds AND publishes a pre-release, see Outputs)
#   - push of a tag matching v* (path filters are not evaluated for tag pushes)
#   - pull_request to main (same path filters; no secrets are used)
#   - workflow_dispatch (manual)
#
# Outputs
#   - Workflow artifact "floq-windows-<version>-<sha>" (14 days retention)
#   - On a push to main: only the workflow artifact above (a compile and packaging check); no GitHub release.
#   - On a v* tag: the installers are also attached to a published PRE-release
#     for that tag.
#
# How to cut a release: bump the version, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
# The pre-release is published automatically; edit its notes in the GitHub UI after this workflow
# has finished. (macOS builds are not published for now.)
#
# Release creation:
#   We deliberately do NOT let tauri-action create the release (tagName input).
#   Instead the `release` job runs `gh release view || gh release create` and
#   retries once on "already exists", then `gh release upload --clobber`. This
#   also stays safe if a second platform workflow is added later and runs in
#   parallel on the same tag: whoever gets there first creates the release and
#   the other reuses it.
#
# Secrets: none required. Only the built-in GITHUB_TOKEN is used.
#   Optional code signing through the free SignPath Foundation OSS program, see docs/code-signing.md.
#   Signing runs ONLY on a v* tag push and ONLY when the secret SIGNPATH_API_TOKEN and the repository
#   variables SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG exist (variables SIGNPATH_SIGNING_POLICY_SLUG,
#   default release-signing, and SIGNPATH_ARTIFACT_CONFIGURATION_SLUG are optional). Without them the build
#   is the plain unsigned one, exactly as before (SmartScreen will warn). When signing is on, the app exe and
#   then the NSIS installer are each sent to SignPath; the release job hashes the files that were published.
#
# Repo settings: Actions enabled. Workflow permissions can stay "Read repository
#   contents" because the release job requests `contents: write` itself.
#
# Hardening note: every third-party action is pinned to a full commit SHA (the
# version is in the trailing comment). Dependabot (github-actions) proposes bumps.
# Verify a download: compare it with the release's SHA256SUMS, and run
# `gh attestation verify <installer>.exe --repo <owner>/<repo>` for the build provenance (public repositories only).

name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'runtime/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR builds are cancelled: every push to main and every tag must finish and publish its release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    # Signed tag builds wait for a manual SignPath approval (release-signing policy), hence the long limit.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
      # Needed by the SignPath action to read job details when the repo is private and the SignPath GitHub App is absent.
      actions: read
    env:
      # Secrets cannot be tested in `if:` directly, so the decision is made once here.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' && vars.SIGNPATH_PROJECT_SLUG != '' }}
      SP_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SP_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SP_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
      SP_ARTIFACT_CONFIG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || '' }}
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: 'src-tauri -> target'

      - name: Compute artifact name
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "artifact=floq-windows-${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # Unsigned path (default): identical to the previous behaviour.
      - name: Build with Tauri
        if: env.SIGN != 'true'
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: .
          args: --bundles nsis

      # Signed path (v* tags with SignPath configured): build the app exe, sign it, bundle the NSIS installer
      # around the signed exe, then sign the installer. Each signing request needs a manual approval in SignPath.
      - name: Build app binary (signed path)
        if: env.SIGN == 'true'
        shell: bash
        run: npx tauri build --no-bundle

      - name: Upload unsigned app exe
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app-exe
          path: src-tauri/target/release/floq.exe
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign app exe with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SP_ORG }}
          project-slug: ${{ env.SP_PROJECT }}
          signing-policy-slug: ${{ env.SP_POLICY }}
          artifact-configuration-slug: ${{ env.SP_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/app
          skip-decompress: true

      - name: Replace app exe with the signed one and bundle the installer
        if: env.SIGN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -l signed/app
          cp -f signed/app/floq.exe src-tauri/target/release/floq.exe
          npx tauri bundle --bundles nsis

      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-installer
        shell: bash
        run: |
          set -euo pipefail
          # Single installer expected; fail loudly otherwise (archive:false needs exactly one file).
          [ "$(ls src-tauri/target/release/bundle/nsis/*.exe | wc -l)" = 1 ]
          echo "path=$(ls src-tauri/target/release/bundle/nsis/*.exe)" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned installer artifact
        if: env.SIGN == 'true'
        id: unsigned-installer-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-installer
          path: ${{ steps.unsigned-installer.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Sign installer with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SP_ORG }}
          project-slug: ${{ env.SP_PROJECT }}
          signing-policy-slug: ${{ env.SP_POLICY }}
          artifact-configuration-slug: ${{ env.SP_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.unsigned-installer-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed/installer
          skip-decompress: true

      - name: Replace installer with the signed one
        if: env.SIGN == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ls -l signed/installer
          for f in src-tauri/target/release/bundle/nsis/*.exe; do
            cp -f "signed/installer/$(basename "$f")" "$f"
          done
          powershell -NoProfile -Command "Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Get-AuthenticodeSignature | Format-List Path,Status,SignerCertificate"

      # GitHub offers attestations only for public repositories (user-owned private repos get a 422 and fail the build), so
      # this step runs only when the repo is public. SHA256SUMS on the release still covers integrity either way.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' && github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      BUILD_ARTIFACT: ${{ needs.build.outputs.artifact }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist-installers

      - name: Create pre-release if missing (race tolerant) and upload
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          create() {
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --title "Floq $TAG" --generate-notes --verify-tag
          }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! create 2> create.err; then
              if grep -qi 'already exists' create.err; then
                echo "Release created concurrently by the other workflow; reusing it."
              else
                cat create.err >&2
                # One retry for transient errors, then require the release to exist.
                sleep 5
                create || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
              fi
            fi
          fi
          mapfile -t files < <(find dist-installers -type f \( -name '*.exe' -o -name '*.msi' \))
          [ "${#files[@]}" -gt 0 ] || { echo "No installers found" >&2; exit 1; }
          (cd dist-installers && find . -type f -name '*.exe' -exec sha256sum {} + | sed 's#  \./#  #; s#  .*/#  #' > SHA256SUMS)
          files+=(dist-installers/SHA256SUMS)
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
