# Build Windows
#
# Builds the Floq desktop app (Tauri 2) on windows-latest and produces an NSIS
# installer (.exe) and an MSI (.msi). Unsigned for now.
#
# Triggers
#   - push to main (ignoring docs/**, **.md and runtime/**; the Node runtime is
#     not part of the desktop bundle)
#   - push of a tag matching v* (path filters are not evaluated for tag pushes)
#   - pull_request to main (same path filters; no secrets are used)
#   - workflow_dispatch (manual)
#
# Outputs
#   - Workflow artifact "floq-windows-<version>-<sha>" (14 days retention)
#   - On a v* tag: the installers are also attached to a DRAFT GitHub Release
#     for that tag.
#
# How to cut a release: bump the version, then `git tag vX.Y.Z && git push origin vX.Y.Z`.
# Review and publish the draft release in the GitHub UI once this workflow
# has finished. (macOS builds are not published for now.)
#
# Release creation:
#   We deliberately do NOT let tauri-action create the release (tagName input).
#   Instead the `release` job runs `gh release view || gh release create` and
#   retries once on "already exists", then `gh release upload --clobber`. This
#   also stays safe if a second platform workflow is added later and runs in
#   parallel on the same tag: whoever gets there first creates the draft and
#   the other reuses it.
#
# Secrets: none required. Only the built-in GITHUB_TOKEN is used.
#   Windows code signing is not configured (installers are unsigned, so
#   SmartScreen will warn). Add it later (e.g. Azure Trusted Signing or a
#   certificate via bundle.windows.signCommand) without changing this layout.
#
# Repo settings: Actions enabled. Workflow permissions can stay "Read repository
#   contents" because the release job requests `contents: write` itself.
#
# Hardening note: third-party actions are pinned to major tags; consider pinning
# them to full commit SHAs later (e.g. with Dependabot or pinact).

name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'runtime/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'runtime/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.meta.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Compute artifact name
        id: meta
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "artifact=floq-windows-${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: --bundles nsis,msi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist-installers

      - name: Create draft release if missing (race tolerant) and upload
        shell: bash
        run: |
          set -euo pipefail
          create() {
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "Floq $TAG" --generate-notes --verify-tag
          }
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! create 2> create.err; then
              if grep -qi 'already exists' create.err; then
                echo "Release created concurrently by the other workflow; reusing it."
              else
                cat create.err >&2
                # One retry for transient errors, then require the release to exist.
                sleep 5
                create || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
              fi
            fi
          fi
          mapfile -t files < <(find dist-installers -type f \( -name '*.exe' -o -name '*.msi' \))
          [ "${#files[@]}" -gt 0 ] || { echo "No installers found" >&2; exit 1; }
          gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
