# Dokploy-ready: deploy as a "Docker Compose" service (build context = this folder).
# Set the variables below in Dokploy > Environment. Do NOT publish host ports:
# in Dokploy > Domains add a domain for service `runtime`, container port 8787,
# HTTPS on (Let's Encrypt). Traefik proxies WebSocket upgrades automatically.
# Set BETTER_AUTH_URL to that public https URL.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: floq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy Environment}
      POSTGRES_DB: floq
    volumes:
      - pgdata3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floq -d floq"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Optional agent memory store (the runtime does not depend on it) ---
  # Enable: in .env set COMPOSE_PROFILES=memory, FLOQ_REDIS_PASSWORD=<long random> and
  #   FLOQ_REDIS_URL=redis://:<same password>@dragonfly:6379
  # The store is only reachable on the compose network (no host port) and refuses to start without a password,
  # because agent sandboxes share that network. Compose reads every service even in inactive profiles, so the
  # password is checked when the container starts, not when the file is parsed.
  #
  # Dragonfly (recommended, profile `memory`): snapshots every 5 minutes and on graceful stop.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.1.0
    profiles: ["memory"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      FLOQ_REDIS_PASSWORD: ${FLOQ_REDIS_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - |
        test -n "$$FLOQ_REDIS_PASSWORD" || { echo "FLOQ_REDIS_PASSWORD is required to start the memory store" >&2; exit 1; }
        exec dragonfly --logtostderr --requirepass="$$FLOQ_REDIS_PASSWORD" --dir=/data --dbfilename=dump --df_snapshot_format=true --snapshot_cron="*/5 * * * *" --maxmemory=1gb --proactor_threads=4
    ulimits:
      memlock: -1
    volumes:
      - dragonflydata:/data
    # No redis-cli in the image: speak RESP over bash's /dev/tcp (AUTH, then PING, expect +PONG).
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |
          exec 3<>/dev/tcp/127.0.0.1/6379 && printf 'AUTH %s\r\nPING\r\n' "$$FLOQ_REDIS_PASSWORD" >&3 && read -t 3 -r a <&3 && read -t 3 -r b <&3 && [ "$${b%$$'\r'}" = "+PONG" ]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis 8+ (alternative, profile `memory-redis`, needs the Query Engine that ships with Redis 8): AOF + RDB, same password rule.
  # Use FLOQ_REDIS_URL=redis://:<password>@redis:6379 and COMPOSE_PROFILES=memory-redis. Run one of the two, not both.
  redis:
    image: redis:8.2
    profiles: ["memory-redis"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      FLOQ_REDIS_PASSWORD: ${FLOQ_REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${FLOQ_REDIS_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - |
        test -n "$$FLOQ_REDIS_PASSWORD" || { echo "FLOQ_REDIS_PASSWORD is required to start the memory store" >&2; exit 1; }
        exec redis-server --requirepass "$$FLOQ_REDIS_PASSWORD" --appendonly yes --appendfsync everysec --save 300 10 --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- Built-in WhatsApp server (on by default; its own container in this compose, the runtime does not depend on it) ---
  # WAHA Core (https://github.com/devlikeapro/waha, Apache-2.0), the official image, unmodified. Nothing to set up: the runtime
  # creates a random API key once in the shared `wahakey` volume, WAHA waits for it and starts with it, and the WhatsApp
  # integration uses this server, registers its webhook on the compose network and keeps the server updated (Settings > Updates).
  # You only scan the QR code. Own key: FLOQ_WHATSAPP_API_KEY=<openssl rand -hex 32>. Off: FLOQ_WHATSAPP_BUILTIN=0 and
  # `docker compose stop waha`. No host port: only the runtime talks to it. See runtime/README.md.
  # The tag is the floor: Floq moves the container to newer stable releases itself and puts its release back after a redeploy.
  # ARM hosts: FLOQ_WHATSAPP_IMAGE_TAG=noweb-arm-2026.10.1
  waha:
    image: devlikeapro/waha:${FLOQ_WHATSAPP_IMAGE_TAG:-noweb-2026.10.1}
    restart: unless-stopped
    # The image's own start (tini -> /entrypoint.sh), once the runtime has written the shared key.
    command: ["/bin/sh", "-c", "until [ -s /floq/api-key ]; do sleep 2; done; WAHA_API_KEY=\"$$(cat /floq/api-key)\"; export WAHA_API_KEY; exec /entrypoint.sh"]
    stop_grace_period: 30s
    expose:
      - "3000"
    # The runtime reaches it as floq-whatsapp: hosts like Dokploy also put the runtime on a shared proxy network where another
    # stack's service may be called "waha", and that name would then point at the wrong server.
    networks:
      default:
        aliases: [floq-whatsapp]
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      WAHA_BASE_URL: http://floq-whatsapp:3000
      # No web UI on this server: Floq is the interface.
      WAHA_DASHBOARD_ENABLED: "False"
      WHATSAPP_SWAGGER_ENABLED: "False"
      # Linked accounts reconnect by themselves after a restart or an update.
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WAHA_PRINT_QR: "False"
      WAHA_LOG_FORMAT: JSON
      WAHA_LOG_LEVEL: ${FLOQ_WHATSAPP_LOG_LEVEL:-info}
      # Media stays on the local volume (Floq copies what it shows into its own database; WAHA deletes its copies after a few minutes).
      WAHA_MEDIA_STORAGE: LOCAL
      WHATSAPP_FILES_FOLDER: /app/.media
    volumes:
      # The linked WhatsApp accounts. Losing this volume means scanning the QR code again.
      - wahasessions:/app/.sessions
      - wahamedia:/app/.media
      # The API key the runtime creates (read only here).
      - wahakey:/floq:ro
    # /ping needs no API key. The image has no curl, so Node (which WAHA runs on) makes the request.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ping').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${FLOQ_WHATSAPP_MEM_LIMIT:-1g}
    cpus: ${FLOQ_WHATSAPP_CPUS:-1.0}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  runtime:
    build:
      context: ./runtime
      dockerfile: Dockerfile
    image: floq-runtime:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"
    environment:
      DATABASE_URL: postgres://floq:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in Dokploy Environment}@db:5432/floq
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -base64 48)}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL to the public https URL}
      FLOQ_ENCRYPTION_KEY: ${FLOQ_ENCRYPTION_KEY:?set FLOQ_ENCRYPTION_KEY (openssl rand -hex 32)}
      FLOQ_ALLOW_SIGNUP: ${FLOQ_ALLOW_SIGNUP:-0}
      FLOQ_BOOTSTRAP_ADMIN_EMAIL: ${FLOQ_BOOTSTRAP_ADMIN_EMAIL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      # Co-author added to commits made in sessions. Unset = default; set empty to disable for everyone.
      FLOQ_GIT_COAUTHOR: ${FLOQ_GIT_COAUTHOR-floqless <floq@flowless.app>}
      FLOQ_ALLOWED_ORIGINS: ${FLOQ_ALLOWED_ORIGINS:-tauri://localhost,http://tauri.localhost,http://localhost:1420}
      FLOQ_CLAUDE_MODELS: ${FLOQ_CLAUDE_MODELS:-}
      FLOQ_CODEX_MODELS: ${FLOQ_CODEX_MODELS:-}
      # 1 = seed and list the third-party skills baked into the image. Floq skills are always kept. Default: off.
      PREINSTALL_SKILLS: ${PREINSTALL_SKILLS:-0}
      FLOQ_PORT: "8787"
      FLOQ_HOST: "0.0.0.0"
      FLOQ_SHARD_DRIVER: linux
      # Per-tenant network isolation: every user's sandboxes get their own network namespace (pasta gives them outbound
      # internet; the runtime port is the only host service they reach). Default: required = the runtime refuses to start
      # if the host cannot provide it (needs CAP_SYS_ADMIN + CAP_NET_ADMIN below, nftables in the kernel).
      # off = all sandboxes share one network: single-tenant / fully trusted hosts only. 1 = isolate, but fall back to off if the probe fails.
      FLOQ_NETNS: ${FLOQ_NETNS:-required}
      # Extra IPv4 destinations (comma-separated addresses/CIDRs) the sandboxes may reach despite the private-range drops,
      # e.g. an internal database on the Docker network. Empty = none.
      FLOQ_NETNS_ALLOW: ${FLOQ_NETNS_ALLOW:-}
      FLOQ_UPDATE_RUNTIME_COMMAND: ${FLOQ_UPDATE_RUNTIME_COMMAND:-}
      FLOQ_SHARD_ROOT: /var/lib/floq/shards
      FLOQ_SHARD_LOCK_DELAY_MS: ${FLOQ_SHARD_LOCK_DELAY_MS:-30000}
      FLOQ_SESSION_IDLE_TIMEOUT_MS: ${FLOQ_SESSION_IDLE_TIMEOUT_MS:-300000}
      FLOQ_SESSION_MAX_LIFETIME_MS: ${FLOQ_SESSION_MAX_LIFETIME_MS:-3600000}
      FLOQ_LOG_LEVEL: ${FLOQ_LOG_LEVEL:-info}
      # Agents run below the runtime's CPU priority and above its OOM score, so a busy or memory-hungry agent cannot
      # freeze the terminals or get the runtime killed at mem_limit. 0 turns either off.
      FLOQ_SANDBOX_NICE: ${FLOQ_SANDBOX_NICE:-10}
      FLOQ_SANDBOX_OOM_SCORE_ADJ: ${FLOQ_SANDBOX_OOM_SCORE_ADJ:-500}
      # Claude Code prompt cache (see runtime/README.md "Prompt cache"). auto = let the CLI choose; 5m | 1h force it.
      FLOQ_CACHE_TTL: ${FLOQ_CACHE_TTL:-auto}
      FLOQ_CACHE_HELPER_TTL: ${FLOQ_CACHE_HELPER_TTL:-auto}
      FLOQ_CACHE_DISABLE: ${FLOQ_CACHE_DISABLE:-0}
      # Agent memory (optional; see the dragonfly / redis services). Empty FLOQ_REDIS_URL = memory off.
      FLOQ_REDIS_URL: ${FLOQ_REDIS_URL:-}
      FLOQ_EMBEDDINGS: ${FLOQ_EMBEDDINGS:-local}
      FLOQ_EMBEDDINGS_MODEL: ${FLOQ_EMBEDDINGS_MODEL:-}
      FLOQ_EMBEDDINGS_DIMS: ${FLOQ_EMBEDDINGS_DIMS:-}
      FLOQ_EMBEDDINGS_THREADS: ${FLOQ_EMBEDDINGS_THREADS:-4}
      FLOQ_EMBEDDINGS_DTYPE: ${FLOQ_EMBEDDINGS_DTYPE:-}
      FLOQ_EMBEDDINGS_CACHE: /var/lib/floq/embeddings
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Built-in WhatsApp server (see the waha service). No key set: the runtime creates one in the shared key file. 0 = off.
      FLOQ_WHATSAPP_API_KEY: ${FLOQ_WHATSAPP_API_KEY:-}
      FLOQ_WHATSAPP_KEY_FILE: /var/lib/floq/whatsapp/api-key
      FLOQ_WHATSAPP_BUILTIN: ${FLOQ_WHATSAPP_BUILTIN:-1}
      FLOQ_WHATSAPP_URL: ${FLOQ_WHATSAPP_URL:-http://floq-whatsapp:3000}
      # Where services on the compose network reach this runtime (WAHA delivers its webhooks here).
      FLOQ_INTERNAL_URL: ${FLOQ_INTERNAL_URL:-http://runtime:8787}
    volumes:
      - shards3:/var/lib/floq/shards
      # The built-in WhatsApp server's API key, shared with the waha service only.
      - wahakey:/var/lib/floq/whatsapp
      # Downloaded embedding models survive image rebuilds.
      - embeddings3:/var/lib/floq/embeddings
      # In-app "Update runtime" (Settings > Runtime > Updates): the runtime rebuilds itself from the newest release and
      # swaps its own container through the Docker Engine. Mounted under /run, which agent sandboxes replace with an
      # empty tmpfs, and root-only on the host, so agents cannot reach it. Remove this line to turn in-app updates off.
      - /var/run/docker.sock:/run/floq-docker.sock
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Per-user shards need gocryptfs (FUSE) mounts and bubblewrap namespaces.
    # Agent processes are started with no-new-privs under a per-user uid, never as root.
    devices:
      - /dev/fuse:/dev/fuse
      # FLOQ_NETNS: pasta builds the per-user tap device through /dev/net/tun.
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      # FLOQ_NETNS: configure the per-user namespaces (lo, nft egress rules, pasta tap) from the runtime.
      - NET_ADMIN
      - SETUID
      - SETGID
      - SETPCAP
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SYS_CHROOT
    security_opt:
      # Host with kernel.apparmor_restrict_unprivileged_userns=1: set FLOQ_APPARMOR_PROFILE=floq-runtime (runtime/apparmor/floq-runtime) so Chromium can use its sandbox.
      - apparmor:${FLOQ_APPARMOR_PROFILE:-unconfined}
      - systempaths=unconfined
      # Docker's default seccomp profile plus pivot_root (for CAP_SYS_ADMIN only), which bubblewrap needs.
      # Generated from moby docker-v29.8.2 vendor/github.com/moby/profiles/seccomp/default.json.
      - seccomp:./runtime/seccomp-floq.json
    pids_limit: 4096
    mem_limit: ${FLOQ_MEM_LIMIT:-8g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata3:
  wahasessions:
  wahamedia:
  wahakey:
  redisdata:
  dragonflydata:
  embeddings3:
  shards3:
